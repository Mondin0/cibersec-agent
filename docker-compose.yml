services:
  agent:
    build: .
    image: defensive-security-agent:local
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    network_mode: bridge
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./evidence
        target: /evidence
        bind:
          create_host_path: false
